<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora e IMC</title>
    <link rel="stylesheet" href="./CSS/style.css">
    
</head>
<body>
    <div class="fundo">
       
        <div class="container-app">
            <h1>calculadora</h1>
            <p id="resultado"></p>
            <table>
                <tr>
                    <td><button class="botao" onclick="del()">Del</button></td>
                    <td><button class="botao" onclick="clean()">C</button></td>
                    <td><button class="botao" onclick="insert('/')">/</button></td>
                    <td><button class="botao" onclick="insert('*')">×</button></td>
                </tr>
                <tr>
                    <td><button class="botao" onclick="insert('7')">7</button></td>
                    <td><button class="botao" onclick="insert('8')">8</button></td>
                    <td><button class="botao" onclick="insert('9')">9</button></td>
                    <td><button class="botao" onclick="insert('-')">-</button></td>
                </tr>
                <tr>
                    <td><button class="botao" onclick="insert('4')">4</button></td>
                    <td><button class="botao" onclick="insert('5')">5</button></td>
                    <td><button class="botao" onclick="insert('6')">6</button></td>
                    <td><button class="botao" onclick="insert('+')">+</button></td>
                </tr>  
                <tr>
                    <td><button class="botao" onclick="insert('1')">1</button></td>
                    <td><button class="botao" onclick="insert('2')">2</button></td>
                    <td><button class="botao" onclick="insert('3')">3</button></td>
                    <td rowspan="2"><button class="botao" style="height: 120px; border-radius: 30px;" onclick="calcular('=')">=</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class="botao" style="width: 120px; border-radius: 30px;" onclick="insert('0')">0</button></td>
                    <td><button class="botao" onclick="insert('.')">.</button></td>
                </tr>
            </table>
        </div>

       
        <div class="container-app">
            <h1>calculadora imc</h1>
            <div id="resultado-imc">Insira seus dados</div>
            <div class="imc-box">
                <div class="input-grupo">
                    <label for="peso">Peso (ex: 70)</label>
                    <input type="number" id="peso" placeholder="Digite seu peso em kg">
                </div>
                <div class="input-grupo">
                    <label for="altura">Altura (ex: 1.75)</label>
                    <input type="number" id="altura" step="0.01" placeholder="Digite sua altura em metros">
                </div>
                <button class="btn-imc" onclick="calcularIMC()">Calcular IMC</button>
               
            </div>
        </div>
    </div>
    
    <script>
        function insert(num){
            document.getElementById('resultado').innerHTML += num;
        }
        function clean(){
            document.getElementById('resultado').innerHTML = "";
        }
        function del(){
            let resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = resultado.substring(0, resultado.length - 1);
        }
        function calcular(operacao){
            let resultado = document.getElementById('resultado').innerHTML;
            if(resultado){
                document.getElementById('resultado').innerHTML = eval(resultado);
            }
        }

       
        function calcularIMC() {
            let peso = parseFloat(document.getElementById('peso').value);
            let altura = parseFloat(document.getElementById('altura').value);
            let visor = document.getElementById('resultado-imc');

            if (!peso || !altura || peso <= 0 || altura <= 0) {
                visor.innerHTML = "Preencha peso e altura válidos!";
                return;
            }

            let imc = peso / (altura * altura);
            let classificacao = "";

            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else {
                classificacao = "Obesidade";
            }

            visor.innerHTML = `IMC: ${imc.toFixed(2)} (${classificacao})`;
        }
    </script>
</body>
</html>
