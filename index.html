<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .fundo{
            background-image: linear-gradient(45deg ,black,blue);
            height: 100vh;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .calculadora{
            position: absolute;
            background-color: rgba(0, 0, 0, 0.7);
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            border-radius: 15px;
            padding: 15px;
        
        }
        .botao{
            width: 50px;
            height: 50px;
            background-color: rgb(78, 74, 74);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        button:hover{
            background-color: rgb(154, 151, 151);
        }
        #resultado{
            background-color: rgb(154, 151, 151);
            width: 200px;
            height: 35px;
            margin: 12px ;
            border-radius: 10px;
            font-size: 20px;
            text-align: right;
            color: black;
            
        }
       
       




    </style>



</head>
<body>
        <div class="fundo" >
            <div class="calculadora" >
                <h1>calculadora</h1>
                <p id="resultado" ></p>
                <table>
                    <tr>
                        <td><button class="botao" onclick="del()" >Del</button></td>
                        <td><button class="botao" onclick="clean()" >Clear</button></td>
                        <td><button class="botao" onclick="insert('/')" >/</button></td>
                        <td><button class="botao" onclick="insert('*')" >X</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao" onclick="insert('9')" >9</button></td>
                        <td><button class="botao" onclick="insert('8')" >8</button></td>
                        <td><button class="botao" onclick="insert('7')" >7</button></td>
                        <td><button class="botao" onclick="insert ('-')"  >-</button></td>
                    </tr>
                    <tr>
                        <td><button class="botao" onclick="insert('4')" >4</button></td>
                        <td><button class="botao" onclick="insert('5')" >5</button></td>
                        <td><button class="botao" onclick="insert('6')" >6</button></td>
                        <td><button class="botao" onclick="insert ('+')"  >+</button></td>
                    </tr>  
                    <tr>
                        <td><button class="botao" onclick="insert('3')" >3</button></td>
                        <td><button class="botao" onclick="insert('2')" >2</button></td>
                        <td><button class="botao" onclick="insert('1')" >1</button></td>
                        <td rowspan="2" ><button class="botao" style="height: 90px;" onclick="calcular('=')" >=</button></td>
                    </tr>
                    <tr>
                        <td colspan="2" ><button class="botao" style="width: 90px;" onclick="insert('0')" >0</button></td>
                        <td><button class="botao" onclick="insert('.')" >.</button></td>

                    </tr>
                </table>
                        </div>
                </div>
                
                <script>
                    function insert (num){
                        document.getElementById('resultado').innerHTML += num;

                    }
                    function clean(){
                        document.getElementById('resultado').innerHTML = "";
                    }
                    function del(){
                        let resultado = document.getElementById('resultado').innerHTML;
                        document.getElementById('resultado').innerHTML = resultado.substring(0, resultado.length -1);
                    }
                    function calcular (operacao){
                        let resultado = document.getElementById('resultado').innerHTML;
                        if(resultado){
                            document.getElementById('resultado').innerHTML = eval(resultado);
                        }
                    }
                </script>
</body>
</html>
